<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}アポイント予約{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI",
        "Meiryo", sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 64px;
      line-height: 1.6;
      color: #1f2328;
      background: #f8f9fb;
    }
    h1 { font-size: 1.4rem; margin-top: 0; }
    h2 { font-size: 1.1rem; margin-top: 1.8rem; }
    .card {
      background: #fff;
      border: 1px solid #e3e6ea;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 18px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    input[type=text], input[type=email], textarea, select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #c8ccd1;
      border-radius: 6px;
      font-size: 1rem;
      background: #fff;
    }
    textarea { min-height: 90px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > * { flex: 1 1 200px; }
    button, .button {
      display: inline-block;
      background: #1a73e8;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    button.secondary, .button.secondary {
      background: transparent;
      color: #1a73e8;
      border: 1px solid #1a73e8;
    }
    .slot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .slot-grid button {
      background: #fff;
      color: #1a73e8;
      border: 1px solid #b9d3f5;
      font-weight: 500;
      padding: 8px 4px;
    }
    .slot-grid button:hover { background: #eaf2ff; }
    .day-block { margin-bottom: 16px; }
    .day-heading { font-weight: 600; margin-bottom: 4px; }
    .muted { color: #5f6368; font-size: 0.92rem; }
    .error { background: #fdecea; color: #b3261e; padding: 12px 14px; border-radius: 6px; margin: 12px 0; }
    .ok { background: #e6f4ea; color: #1e7e34; padding: 12px 14px; border-radius: 6px; margin: 12px 0; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      background: #eef2f6; color: #1a73e8; font-size: 0.8rem; margin-left: 6px;
    }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>

# Fly.io configuration for the habit tracker.
# Edit `app` after first `fly launch` if Fly suggests a different unique name.

app = "habit-tracker"
primary_region = "nrt"  # Tokyo

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HABIT_DB_PATH = "/data/habits.db"
  TZ = "Asia/Tokyo"

[[mounts]]
  source = "habit_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

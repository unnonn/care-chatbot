<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3f4f6" />
  <title>習慣チェック</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen pb-24">
  <header class="sticky top-0 z-10 bg-white border-b border-gray-200">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <h1 class="text-lg font-bold">習慣チェック</h1>
      <div class="flex items-center gap-2">
        <a href="/stats" class="px-3 py-1.5 text-sm rounded-md bg-gray-100 hover:bg-gray-200 active:bg-gray-300">集計</a>
        <button id="open-settings" class="p-2 rounded-md hover:bg-gray-100" aria-label="設定">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317a1.724 1.724 0 013.35 0 1.724 1.724 0 002.591 1.07 1.724 1.724 0 012.37 2.37 1.724 1.724 0 001.07 2.59 1.724 1.724 0 010 3.351 1.724 1.724 0 00-1.07 2.59 1.724 1.724 0 01-2.37 2.37 1.724 1.724 0 00-2.59 1.07 1.724 1.724 0 01-3.35 0 1.724 1.724 0 00-2.591-1.07 1.724 1.724 0 01-2.37-2.37 1.724 1.724 0 00-1.07-2.59 1.724 1.724 0 010-3.351 1.724 1.724 0 001.07-2.59 1.724 1.724 0 012.37-2.37 1.724 1.724 0 002.59-1.07z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </button>
      </div>
    </div>

    <div class="max-w-2xl mx-auto px-4 pb-3 flex items-center justify-between">
      <button id="prev-day" class="p-2 rounded-md hover:bg-gray-100" aria-label="前日">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <div class="text-center">
        <input id="date-input" type="date" class="font-semibold text-base bg-transparent text-center border-none focus:ring-0" />
        <div id="date-label" class="text-xs text-gray-500 mt-0.5"></div>
      </div>
      <button id="next-day" class="p-2 rounded-md hover:bg-gray-100" aria-label="翌日">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-4 space-y-6">
    <section>
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-sm font-bold text-gray-700 flex items-center gap-2">
          <span class="text-yellow-500">☀</span>朝のタスク
        </h2>
        <span id="morning-progress" class="text-xs text-gray-500"></span>
      </div>
      <ul id="morning-list" class="space-y-2 min-h-[40px] bg-white rounded-lg border border-gray-200 p-2"></ul>
      <button class="add-habit text-xs text-gray-500 mt-2 px-2 py-1 rounded hover:bg-gray-100" data-type="morning">＋ 朝のタスクを追加</button>
    </section>

    <section>
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-sm font-bold text-gray-700 flex items-center gap-2">
          <span class="text-indigo-500">☾</span>夜のタスク
        </h2>
        <span id="evening-progress" class="text-xs text-gray-500"></span>
      </div>
      <ul id="evening-list" class="space-y-2 min-h-[40px] bg-white rounded-lg border border-gray-200 p-2"></ul>
      <button class="add-habit text-xs text-gray-500 mt-2 px-2 py-1 rounded hover:bg-gray-100" data-type="evening">＋ 夜のタスクを追加</button>
    </section>

    <p class="text-xs text-gray-400 text-center pt-4">
      ・ドラッグで並び替え／朝↔夜の入れ替えができます<br>
      ・タスクを長押し（またはアイコンタップ）で編集
    </p>
  </main>

  <!-- Add/Edit Habit Modal -->
  <div id="habit-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-20">
    <div class="bg-white rounded-lg w-full max-w-sm p-5">
      <h3 id="habit-modal-title" class="text-base font-bold mb-3">タスクを追加</h3>
      <label class="block text-xs text-gray-600 mb-1">タスク名</label>
      <input id="habit-name" type="text" maxlength="120" class="w-full border border-gray-300 rounded px-3 py-2 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <label class="block text-xs text-gray-600 mb-1">時間帯</label>
      <div class="flex gap-2 mb-4">
        <label class="flex-1 border border-gray-300 rounded px-3 py-2 cursor-pointer text-sm has-[:checked]:bg-blue-50 has-[:checked]:border-blue-500">
          <input type="radio" name="habit-type" value="morning" class="mr-1" /> 朝
        </label>
        <label class="flex-1 border border-gray-300 rounded px-3 py-2 cursor-pointer text-sm has-[:checked]:bg-blue-50 has-[:checked]:border-blue-500">
          <input type="radio" name="habit-type" value="evening" class="mr-1" /> 夜
        </label>
      </div>
      <div class="flex items-center justify-between gap-2">
        <button id="habit-delete" class="hidden text-sm text-red-600 px-3 py-2 rounded hover:bg-red-50">削除</button>
        <div class="flex gap-2 ml-auto">
          <button id="habit-cancel" class="text-sm px-3 py-2 rounded hover:bg-gray-100">キャンセル</button>
          <button id="habit-save" class="text-sm px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-20">
    <div class="bg-white rounded-lg w-full max-w-sm p-5">
      <h3 class="text-base font-bold mb-3">設定</h3>
      <label class="block text-xs text-gray-600 mb-1">通知先メールアドレス</label>
      <input id="setting-email" type="email" placeholder="you@example.com" class="w-full border border-gray-300 rounded px-3 py-2 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <label class="flex items-center gap-2 text-sm mb-1">
        <input id="setting-enabled" type="checkbox" />
        翌日記入忘れ時にメール通知
      </label>
      <p class="text-xs text-gray-500 mb-4">毎朝10時(JST)に前日の記入をチェックします。</p>
      <div class="flex justify-between gap-2">
        <button id="setting-test" class="text-xs text-gray-600 px-2 py-2 rounded hover:bg-gray-100">通知テスト</button>
        <div class="flex gap-2">
          <button id="setting-cancel" class="text-sm px-3 py-2 rounded hover:bg-gray-100">閉じる</button>
          <button id="setting-save" class="text-sm px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700">保存</button>
        </div>
      </div>
      <p id="setting-status" class="text-xs text-gray-500 mt-3"></p>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>

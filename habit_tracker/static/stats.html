<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>集計 | 習慣チェック</title>

  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="/static/icons/favicon-64.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="習慣" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen pb-24">
  <header class="sticky top-0 z-10 bg-white border-b border-gray-200">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="text-sm text-gray-500 hover:text-gray-900 flex items-center gap-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        戻る
      </a>
      <h1 class="text-lg font-bold">集計</h1>
      <div class="w-12"></div>
    </div>
    <div class="max-w-2xl mx-auto px-4 pb-3">
      <div class="flex gap-2">
        <button class="tab-btn flex-1 text-sm py-2 rounded-md bg-gray-100" data-tab="overall">全体</button>
        <select id="habit-select" class="flex-1 text-sm rounded-md border border-gray-300 px-2 py-2 bg-white"></select>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-4">
    <div id="period-info" class="text-center text-sm font-semibold text-gray-700 mb-4">
      期間合計: <span id="period-total">0</span>
    </div>

    <div class="grid grid-cols-2 gap-3" id="stat-grid"></div>

    <section class="mt-6" id="monthly-section" style="display:none;">
      <h2 class="text-sm font-bold text-gray-700 mb-2">月次推移（直近12ヶ月）</h2>
      <div class="bg-white rounded-lg border border-gray-200 p-4">
        <div id="monthly-chart" class="space-y-1.5"></div>
      </div>
    </section>

    <section class="mt-6" id="per-habit-section" style="display:none;">
      <h2 class="text-sm font-bold text-gray-700 mb-2">タスク別（今月）</h2>
      <div class="bg-white rounded-lg border border-gray-200 divide-y divide-gray-100" id="per-habit-list"></div>
    </section>
  </main>

  <script src="/static/stats.js"></script>
</body>
</html>
